# Bygger Android-appen (APK) ud fra web-appen i roden af repository'et.
# Kører automatisk, når koden ændres, og kan også startes manuelt under fanen "Actions".
name: Byg Android-app

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'config.js'
      - 'icons/**'
      - 'lib/**'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tjek signeringsadgangskode
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Hemmeligheden KEYSTORE_PASSWORD mangler (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Find versionsnummer
        id: ver
        run: |
          V=$(grep -oP "APP_VERSION = '\K[0-9.]+" app.js)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V (build ${{ github.run_number }})"

      - name: Installér og kopiér web-appen ind
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          npm run sync

      - name: Byg APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/Koretojslog-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Koretojslog-${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          path: dist/*.apk

      - name: Udgiv som release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.ver.outputs.name }}-${{ github.run_number }}
          name: Køretøjslog ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body: |
            Android-app bygget automatisk.
            Download **Koretojslog-${{ steps.ver.outputs.name }}.apk** nedenfor på tablet eller telefon og installér den oven på den gamle version.
          files: dist/*.apk
          make_latest: true
